# === Configuración de deploy de Nexus ===
# Sirve para deploy por drag-and-drop Y por conexión con Git (recomendado).
# El sitio es 100% estático, sin build.

[build]
  publish = "."
  # 1) Tests de la lógica que toca PLATA (stock/combos/descuento por venta + agente
  #    de ads). Si alguno falla, el deploy se ABORTA y el sitio vivo queda intacto
  #    (Netlify mantiene la versión anterior) → nunca se sube lógica de plata rota.
  # 2) Cache-busting por contenido (hashea css/js y setea el SW).
  # Todo zero-dep (solo Node nativo). Local antes de un drag-and-drop:
  #    node --test tests/*.test.js && node build-cache.js
  command = "node --test tests/*.test.js && node build-cache.js"

# El escaneo de secretos de Netlify marca la apiKey de Firebase (AIza...) como
# "likely secret" y frena el build. Es un FALSO POSITIVO: la config web de
# Firebase es publica por diseño (viaja al navegador en cualquier app Firebase);
# la seguridad real la dan las reglas de Firestore y los dominios autorizados.
# Se omite SOLO ese valor: el escaneo de los secretos de verdad (TOKEN_ENC_KEY,
# VAPID_PRIVATE, ML_CLIENT_SECRET, FIREBASE_SA_KEY) sigue activo.
[build.environment]
  SECRETS_SCAN_SMART_DETECTION_OMIT_VALUES = "AIzaSyDlIXaVYhwT-cRzaqzuZQ6HKL5gSb6cRYA"

# === Funciones serverless (Ola 2) ===
# Proxy seguro de tokens de Meta/e-commerce. Sin dependencias npm (solo módulos
# nativos de Node), así el deploy por drag-and-drop las empaqueta con esbuild.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Piloto automatico del agente publicitario (Nivel 3): corre TODOS LOS DIAS
# a las 12:00 UTC (~9:00 en Uruguay). SEGURO POR DISEÑO: es un no-op salvo
# que el titular haya ARMADO una cuenta (campo ads_autopilot="1"), y arranca
# en modo SIMULACION (registra lo que haria, sin escribir en Mercado Libre)
# hasta que el titular pase a modo "real".
[functions."ml-ads-autopilot"]
  schedule = "0 12 * * *"

# Poller de ventas de la tienda propia (Alpha Fitness): cada 10 minutos consulta el
# feed de la tienda y descuenta/re-sincroniza el stock central por cada venta nueva.
# SEGURO: no-op salvo que la tienda esté configurada (ALPHA_SITE_URL) y el titular
# haya sincronizado al menos una vez (registra su uid).
[functions."alpha-store-poll"]
  schedule = "*/10 * * * *"

# === Cabeceras de seguridad (Ola 0 de la auditoría) ===
# Aplicadas a todas las rutas.
[[headers]]
  for = "/*"
  [headers.values]
    # no-referrer: evita que el access_token de Meta (que hoy viaja en la URL)
    # se filtre a terceros por la cabecera Referer. Clave hasta mover a proxy (Ola 2).
    Referrer-Policy = "no-referrer"

    # Anti-clickjacking: nadie puede embeber el dashboard en un iframe.
    X-Frame-Options = "DENY"

    # Evita que el navegador "adivine" tipos MIME (vector de XSS).
    X-Content-Type-Options = "nosniff"

    # Fuerza HTTPS en visitas futuras.
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

    # Apaga APIs del navegador que Nexus no usa.
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), usb=(), payment=()"

    # CSP: bloquea scripts inyectados (XSS) y el embebido en iframes.
    # Nota: 'unsafe-inline' sigue permitido para el script/estilos inline actuales;
    # endurecer con hashes/nonces es una mejora posterior.
    # connect-src APRETADO (Ola 2): el navegador ya NO llama a Meta ni a los
    # endpoints de e-commerce (lo hacen las funciones serverless). Solo necesita
    # 'self' (las funciones + el sitio) y *.googleapis.com (Auth + Firestore).
    # ⚠️ Si tras deployar el login de Firebase fallara, revertir connect-src a
    #    "'self' https:" y avisar (algún dominio de Firebase quedó fuera).
    # script-src permite gstatic.com (SDK de Firebase). frame-src permite el iframe
    # de Firebase Auth (authDomain) que usa para persistir/propagar la sesión.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com https://apis.google.com https://www.googleapis.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://*.googleapis.com; frame-src 'self' https://nexus-systems-17a5b.firebaseapp.com https://accounts.google.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'"
